<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- ── Primary SEO ── -->
  <title>LANSY — Your Style. Your Story.</title>
  <meta name="description" content="Welcome to LANSY — a premium fashion brand redefining elegance. Discover your style, explore our world, and connect with us on social media." />
  <meta name="theme-color" content="#F8F5F0" />
  <meta name="robots" content="index, follow" />
  <meta name="author" content="LANSY" />

  <!-- ── Open Graph ── -->
  <meta property="og:type"        content="website" />
  <meta property="og:title"       content="LANSY — Your Style. Your Story." />
  <meta property="og:description" content="Welcome to LANSY — a premium fashion brand redefining elegance. Discover your style, explore our world." />
  <meta property="og:image"       content="og-image.png" />
  <meta property="og:locale"      content="en_US" />

  <!-- ── Twitter Card ── -->
  <meta name="twitter:card"        content="summary_large_image" />
  <meta name="twitter:title"       content="LANSY — Your Style. Your Story." />
  <meta name="twitter:description" content="Premium fashion brand. Discover your style, explore our world." />
  <meta name="twitter:image"       content="og-image.png" />

  <!-- ── Favicon (inline SVG favicon) ── -->
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='20' fill='%23F8F5F0'/><text x='50' y='72' font-family='Georgia,serif' font-size='62' font-weight='600' text-anchor='middle' fill='%23A67C52'>L</text></svg>" />

  <!-- ── Google Fonts ── -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500&family=DM+Sans:wght@300;400;500;600&display=swap"
    rel="stylesheet"
  />

  <!-- ── Stylesheet ── -->
  <link rel="stylesheet" href="style.css" />
</head>

<body>

  <!-- ████████████████████████████████████████████████
       PAGE WRAPPER
       ████████████████████████████████████████████████ -->
  <div class="page-wrapper">

    <!-- ── MAIN CONTENT ── -->
    <main class="main-content" role="main" aria-label="LANSY brand links">

      <!-- ══════════════════════════════════════
           A. BRAND HEADER
           ══════════════════════════════════════ -->
      <header class="brand-header" aria-label="Brand identity">

        <!-- Monogram / Emblem -->
        <div class="brand-emblem" aria-hidden="true">
          <div class="brand-emblem__ring"></div>
          <div class="brand-emblem__ring brand-emblem__ring--inner"></div>
          <span class="brand-emblem__letter">L</span>
        </div>

        <!-- Decorative Divider -->
        <div class="brand-divider" aria-hidden="true">
          <div class="brand-divider__line"></div>
          <div class="brand-divider__diamond"></div>
          <div class="brand-divider__line brand-divider__line--right"></div>
        </div>

        <!-- Brand Wordmark -->
        <h1 class="brand-wordmark">LANSY</h1>

        <!-- Tagline -->
        <p class="brand-tagline">Your Style. Your Story.</p>

        <!-- Welcome Message -->
        <div class="brand-welcome">
          <span class="brand-welcome__headline">Welcome to LANSY.</span>
          <span class="brand-welcome__sub">Discover your style. Explore our world.</span>
        </div>

      </header>
      <!-- /brand-header -->


      <!-- ══════════════════════════════════════
           C. SOCIAL MEDIA LINKS
           ══════════════════════════════════════ -->
      <nav class="social-links" aria-label="Social media links">

        <!-- ── FACEBOOK ── -->
        <a
          class="social-card"
          href="https://www.facebook.com/share/1CHEhw3tCo/"
          target="_blank"
          rel="noopener noreferrer"
          aria-label="Connect with LANSY on Facebook"
          id="link-facebook"
        >
          <!-- Facebook icon -->
          <div class="social-card__icon-wrap" aria-hidden="true">
            <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" aria-hidden="true" focusable="false">
              <path d="M24 12.073C24 5.403 18.629 0 12 0S0 5.403 0 12.073C0 18.1 4.388 23.094 10.125 24v-8.437H7.078v-3.49h3.047V9.41c0-3.025 1.792-4.697 4.533-4.697 1.312 0 2.686.236 2.686.236v2.97h-1.514c-1.491 0-1.956.93-1.956 1.874v2.25h3.328l-.532 3.49h-2.796V24C19.612 23.094 24 18.1 24 12.073z"/>
            </svg>
          </div>

          <div class="social-card__text">
            <span class="social-card__name">Facebook</span>
            <span class="social-card__desc">Connect with us on Facebook</span>
          </div>

          <!-- Arrow icon -->
          <svg class="social-card__arrow" viewBox="0 0 20 20" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true" focusable="false">
            <path d="M4 10h12M11 5l5 5-5 5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </a>

        <!-- ── INSTAGRAM ── -->
        <a
          class="social-card"
          href="https://instagram.com/lansy.store?psln=NTJ5Z3E5bzRuZWF6"
          target="_blank"
          rel="noopener noreferrer"
          aria-label="Follow LANSY on Instagram @lansy.store"
          id="link-instagram"
        >
          <!-- Instagram icon -->
          <div class="social-card__icon-wrap" aria-hidden="true">
            <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" aria-hidden="true" focusable="false">
              <path d="M12 2.163c3.204 0 3.584.012 4.85.07 3.252.148 4.771 1.691 4.919 4.919.058 1.265.069 1.645.069 4.849 0 3.205-.012 3.584-.069 4.849-.149 3.225-1.664 4.771-4.919 4.919-1.266.058-1.644.07-4.85.07-3.204 0-3.584-.012-4.849-.07-3.26-.149-4.771-1.699-4.919-4.92-.058-1.265-.07-1.644-.07-4.849 0-3.204.013-3.583.07-4.849.149-3.227 1.664-4.771 4.919-4.919 1.266-.057 1.645-.069 4.849-.069zM12 0C8.741 0 8.333.014 7.053.072 2.695.272.273 2.69.073 7.052.014 8.333 0 8.741 0 12c0 3.259.014 3.668.072 4.948.2 4.358 2.618 6.78 6.98 6.98C8.333 23.986 8.741 24 12 24c3.259 0 3.668-.014 4.948-.072 4.354-.2 6.782-2.618 6.979-6.98.059-1.28.073-1.689.073-4.948 0-3.259-.014-3.667-.072-4.947-.196-4.354-2.617-6.78-6.979-6.98C15.668.014 15.259 0 12 0zm0 5.838a6.162 6.162 0 100 12.324 6.162 6.162 0 000-12.324zM12 16a4 4 0 110-8 4 4 0 010 8zm6.406-11.845a1.44 1.44 0 100 2.881 1.44 1.44 0 000-2.881z"/>
            </svg>
          </div>

          <div class="social-card__text">
            <span class="social-card__name">Instagram</span>
            <span class="social-card__desc">Follow our latest styles · @lansy.store</span>
          </div>

          <!-- Arrow icon -->
          <svg class="social-card__arrow" viewBox="0 0 20 20" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true" focusable="false">
            <path d="M4 10h12M11 5l5 5-5 5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </a>

        <!-- ── TIKTOK ── -->
        <a
          class="social-card"
          href="https://www.tiktok.com/@lansyy00?_r=1&_t=ZS-9AYr2rLC8NG"
          target="_blank"
          rel="noopener noreferrer"
          aria-label="Discover LANSY on TikTok @lansyy00"
          id="link-tiktok"
        >
          <!-- TikTok icon -->
          <div class="social-card__icon-wrap" aria-hidden="true">
            <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" aria-hidden="true" focusable="false">
              <path d="M19.59 6.69a4.83 4.83 0 01-3.77-4.25V2h-3.45v13.67a2.89 2.89 0 01-2.88 2.5 2.89 2.89 0 01-2.89-2.89 2.89 2.89 0 012.89-2.89c.28 0 .54.04.79.1V9.01a6.33 6.33 0 00-.79-.05 6.34 6.34 0 00-6.34 6.34 6.34 6.34 0 006.34 6.34 6.34 6.34 0 006.33-6.34V8.69a8.18 8.18 0 004.78 1.52V6.75a4.85 4.85 0 01-1.01-.06z"/>
            </svg>
          </div>

          <div class="social-card__text">
            <span class="social-card__name">TikTok</span>
            <span class="social-card__desc">Discover LANSY on TikTok · @lansyy00</span>
          </div>

          <!-- Arrow icon -->
          <svg class="social-card__arrow" viewBox="0 0 20 20" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true" focusable="false">
            <path d="M4 10h12M11 5l5 5-5 5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </a>

      </nav>
      <!-- /social-links -->


      <!-- ══════════════════════════════════════
           D. BRAND STATEMENT
           ══════════════════════════════════════ -->
      <section class="brand-statement" aria-label="Brand statement">
        <div class="brand-statement__separator" aria-hidden="true">
          <div class="brand-statement__separator-line"></div>
          <div class="brand-statement__sparkle"></div>
          <div class="brand-statement__separator-line"></div>
        </div>
        <p class="brand-statement__text">Effortless Style. Timeless Feeling.</p>
      </section>

    </main>
    <!-- /main-content -->


    <!-- ██████████████████████████████████████
         E. FOOTER
         ██████████████████████████████████████ -->
    <footer class="site-footer" role="contentinfo">
      <p class="site-footer__copy">
        &copy; <span id="copyright-year">2025</span> LANSY. All Rights Reserved.
      </p>
    </footer>

  </div>
  <!-- /page-wrapper -->

  <!-- ── Scripts ── -->
  <script src="script.js"></script>

</body>
</html>
